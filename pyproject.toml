[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "private-find-hub"
version = "0.1.0a1"
requires-python = ">=3.14,<3.15"
dependencies = [
  "argon2-cffi==25.1.0",
  "cryptography==50.0.2",
]

[project.optional-dependencies]
test = [
  "coverage==7.11.3",
  "mypy==1.18.2",
  "pip-audit==2.10.1",
  "pytest==9.2.0",
  "ruff==0.14.8",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = [
  "custom_components.private_find_hub.api",
  "custom_components.private_find_hub.privacy",
  "custom_components.private_find_hub.security",
]
omit = ["*/recorder_checks.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "S", "UP"]
ignore = ["S101", "S105"]

[tool.mypy]
python_version = "3.14"
strict = true
files = [
  "custom_components/private_find_hub/api/client.py",
  "custom_components/private_find_hub/api/decoder.py",
  "custom_components/private_find_hub/api/exceptions.py",
  "custom_components/private_find_hub/api/mock.py",
  "custom_components/private_find_hub/api/models.py",
  "custom_components/private_find_hub/api/transport.py",
  "custom_components/private_find_hub/privacy/gate.py",
  "custom_components/private_find_hub/privacy/validation.py",
  "custom_components/private_find_hub/security/network_policy.py",
  "custom_components/private_find_hub/security/redaction.py",
  "custom_components/private_find_hub/security/vault.py",
]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
  "custom_components.private_find_hub",
  "custom_components.private_find_hub.coordinator",
  "custom_components.private_find_hub.privacy.recorder_checks",
]
ignore_errors = true

